name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: python -m pytest
      - run: python -m compileall -q guardbench
      - run: guardbench run --submitter ci-bot
      - run: guardbench verify-audit
      - run: docker build -t guardbench:test .
