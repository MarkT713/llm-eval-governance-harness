[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardbench"
version = "1.0.0"
description = "Provider-neutral LLM evaluation governance and red-team harness"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pip-audit>=2.7,<3", "pytest>=9.0.3,<10", "ruff>=0.9,<1"]

[project.scripts]
guardbench = "guardbench.cli:main"

[tool.setuptools.packages.find]
include = ["guardbench*"]

[tool.setuptools.package-data]
guardbench = [
  "resources/corpora/*.json",
  "resources/policies/*.json",
  "resources/web/*.html",
  "resources/examples/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
